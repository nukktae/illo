<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<script>(function(){try{var q=new URLSearchParams(location.search).get('view');if(q)sessionStorage.setItem('illo-view',q);var v=sessionStorage.getItem('illo-view');var small=screen.width<=760||window.matchMedia('(max-width: 760px)').matches;var mobilePage=false;var want=v==='desktop'?false:v==='mobile'?true:small;if(want!==mobilePage)location.replace('m-S6-story.html'+location.hash);}catch(e){}})();</script>
<title>일로 · 취업 수기</title>
<link rel="icon" href="assets/illo-logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
body{margin:0}
a{color:#3182F6}a:hover{color:#1B64DA}
</style>
<style>html,body{background:#FAFAFA}#app>div{margin:0 auto;min-height:100vh;height:auto!important}a,button,label{cursor:pointer}:focus-visible{outline:2px solid #3182F6;outline-offset:2px}</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="width: 1280px; height: 900px; box-sizing: border-box; background: #FAFAFA; color: #191F28; font-family: Pretendard, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column;">
  <header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 88px; padding: 0 40px;">
    <a href="index.html" style="justify-self: start; display: block;"><img src="assets/illo-logo.png" alt="일로 홈" style="height: 26px; width: auto; display: block;"></a>
    <nav aria-label="주요 메뉴"><ol style="display: flex; gap: 2px; padding: 4px; margin: 0; list-style: none; border-radius: 999px; background: rgba(0,23,51,0.06);"><li><a href="index.html" style="display: block; padding: 9px 18px; border-radius: 999px; font-size: 14px; line-height: 1.4; color: #4E5968; text-decoration: none; white-space: nowrap;">홈</a></li><li><a href="S1-list.html" style="display: block; padding: 9px 18px; border-radius: 999px; font-size: 14px; line-height: 1.4; color: #4E5968; text-decoration: none; white-space: nowrap;">직무 찾기</a></li><li><a href="E1-edu.html" style="display: block; padding: 9px 18px; border-radius: 999px; font-size: 14px; line-height: 1.4; color: #4E5968; text-decoration: none; white-space: nowrap;">교육과정</a></li><li><a href="S5-path.html" aria-current="page" style="display: block; padding: 9px 18px; border-radius: 999px; font-size: 14px; line-height: 1.4; color: #191F28; font-weight: 600; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,23,51,0.08); text-decoration: none; white-space: nowrap;">마이페이지</a></li></ol></nav>
    <div style="justify-self: end; display: flex; align-items: center; gap: 8px;"><sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ true }}"><a href="L1-login.html" style="height: 40px; padding: 0 14px; display: flex; align-items: center; color: #191F28; font-size: 14px; font-weight: 600; text-decoration: none;">로그인</a><a href="L2-signup.html" style="height: 40px; padding: 0 18px; display: flex; align-items: center; border-radius: 999px; background: #191F28; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none;">회원가입</a></sc-if><sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}"><a href="S5-saved.html" aria-label="저장함 {{ savedCount }}개" style="position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #191F28;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6.5 3.5h11a1 1 0 0 1 1 1V20.5l-6.5-4-6.5 4V4.5a1 1 0 0 1 1-1z"/></svg><sc-if value="{{ hasSaved }}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #3182F6; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{ savedCount }}</span></sc-if></a><a href="S5-path.html" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 4px; border-radius: 999px; background: #FFFFFF; color: #191F28; font-size: 14px; font-weight: 600; text-decoration: none;"><img src="assets/avatar-haneul.jpg" alt="" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; object-fit: cover; display: block;">{{ userName }}님</a></sc-if></div>
  </header>
  <div style="padding: 4px 56px 0; display: flex; flex-direction: column; gap: 6px;">
    <a href="S5-path.html" style="font-size: 14px; color: #6B7684; text-decoration: none;">‹ 마이페이지</a>
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em;">취업 수기 남기기</h1>
  </div>
  <div style="padding: 28px 48px; display: flex; gap: 32px; flex-grow: 1;">
    <section style="flex: 1 1 0; display: flex; flex-direction: column; gap: 18px;">
      <p style="margin: 0; font-size: 16px; color: #333D4B;">내 경험이 다음 청년의 기회가 돼요. 이름과 회사명은 공개되지 않아요.</p>
      <div style="display: flex; gap: 20px;">
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px;">
          <label for="job" style="font-size: 14px; color: #6B7684;">합격한 직무</label>
          <select id="job" style="height: 46px; padding: 0 12px; font-size: 16px; border: none; border-radius: 12px; font-family: inherit; background: #FFFFFF;"><option>SNS 콘텐츠 마케터</option></select>
        </div>
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px;">
          <label for="course" style="font-size: 14px; color: #6B7684;">도움이 된 과정</label>
          <select id="course" style="height: 46px; padding: 0 12px; font-size: 16px; border: none; border-radius: 12px; font-family: inherit; background: #FFFFFF;"><option>(강북5기) AI 활용 SNS 마케터 양성 과정</option></select>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 14px; color: #6B7684;">면접이나 서류에서 도움이 된 경험 (여러 개 선택)</span>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px;">
          <span style="padding: 8px 14px; border-radius: 999px; background: #E8F3FF; color: #1B64DA;">학생회 인스타 운영</span>
          <span style="padding: 8px 14px; border-radius: 999px; background: #E8F3FF; color: #1B64DA;">숏폼 과정 포트폴리오</span>
          <span style="padding: 8px 14px; border-radius: 999px; border: none; background: #FFFFFF;">자격증</span>
          <span style="padding: 8px 14px; border-radius: 999px; border: none; background: #FFFFFF;">어학</span>
          <span style="padding: 8px 14px; border-radius: 999px; border: none; background: #FFFFFF;">공모전</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="tip" style="font-size: 14px; color: #6B7684;">다음 청년에게 한마디 (선택)</label>
        <textarea id="tip" style="height: 110px; box-sizing: border-box; padding: 12px 14px; font-size: 16px; line-height: 1.6; border: none; border-radius: 12px; font-family: inherit; resize: none; background: #FFFFFF;">면접에서 팔로워 증가 수치랑 릴스 포트폴리오를 많이 물어봤어요</textarea>
      </div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <button type="button" onClick="{{ submit }}" style="height: 48px; padding: 0 28px; border: none; border-radius: 14px; background: #3182F6; color: #FFFFFF; font-size: 16px; font-weight: 500; font-family: inherit;">수기 남기기</button>
        <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; color: #6B7684;">남긴 수기는 개인정보를 뺀 통계로만 쓰여요</span></sc-if><sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}"><span role="status" style="padding: 10px 14px; border-radius: 12px; background: #E8F3FF; color: #1B64DA; font-size: 14px;">고마워요! 수기가 등록됐어요 · 시연용이라 실제로 저장되지는 않아요</span></sc-if>
      </div>
    </section>
    <aside style="width: 400px; align-self: flex-start; display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #F2F4F6; border-radius: 16px;">
      <span style="font-size: 13px; color: #6B7684;">다음 청년의 S4 화면에 이렇게 보여요</span>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 18px; background: #FFFFFF; border: none; border-radius: 12px;">
        <span style="font-size: 16px; font-weight: 500;">(강북5기) AI 활용 SNS 마케터 양성 과정</span>
        <span style="font-size: 14px; color: #333D4B;">이 과정을 듣고 SNS 콘텐츠 마케터로 취업한 수기 [N]건</span>
        <span style="font-size: 13px; color: #6B7684;">"면접에서 릴스 포트폴리오를 많이 물어봤어요"</span>
      </div>
      <span style="padding: 6px 10px; align-self: flex-start; border: 1.5px dashed #D1D6DB; border-radius: 6px; font-size: 12px; color: #6B7684;">예시 데이터 · 실제 수기가 쌓이면 표시</span>
    </aside>
  </div>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  illoGet(k, d) { try { const v = window.localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  illoSet(k, v) { try { if (v === null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} this.setState({ illoTick: Date.now() }); }
  illoSaved() { return this.illoGet('illo-saved', [{"id": "post-327326", "kind": "공고", "t": "성분에디터 콘텐츠 마케팅 인턴", "s": "올리브인터내셔널 · 채용연계형 인턴", "u": "https://linkareer.com/activity/327326", "h": "S3-compare.html"}, {"id": "edu-1421", "kind": "교육", "t": "(강북5기) AI 활용 SNS 마케터 양성 과정", "s": "SeSAC 강북 · 모집 중 · 11.08 마감", "u": "https://sesac.seoul.kr/sesac/course/offline/courseDetail.do?crsSn=1421", "h": "C2-course.html"}, {"id": "pol-20261018005400213993", "kind": "정책", "t": "2026 취업날개 서비스 지원", "s": "서울특별시 미래청년기획관 청년정책담당관 · 신청 중", "u": "https://www.youthcenter.go.kr/youthPolicy/ythPlcyTotalSearch/ythPlcyDetail/20261018005400213993", "h": ""}]); }
  sv(item) {
    const on = this.illoSaved().some((x) => x.id === item.id);
    return { saved: on, unsaved: !on, label: on ? '저장 해제' : '저장', toggle: () => { const s = this.illoSaved(); this.illoSet('illo-saved', on ? s.filter((x) => x.id !== item.id) : [item].concat(s)); } };
  }
  illoVals() {
    const u = this.illoGet('illo-user', null), n = this.illoSaved().length;
    return { loggedIn: !!u, loggedOut: !u, userName: u ? u.name : '', userInit: u ? u.name.slice(0, 1) : '', profileName: u ? u.name : '예시 프로필',
      savedCount: n, hasSaved: n > 0,
      loginAs: () => { let name = '김하늘'; try { const el = document.getElementById('su-name'); if (el && el.value.trim()) name = el.value.trim(); window.localStorage.setItem('illo-user', JSON.stringify({ name })); } catch (e) {} },
      logout: () => this.illoSet('illo-user', null) };
  }
  renderVals() { return Object.assign({}, this.illoVals(), this.pageVals()); }
  constructor(props) { super(props); this.state = { sent: false }; }
  pageVals() { const sent = this.state.sent; return { sent, notSent: !sent, submit: () => this.setState({ sent: true }) }; }
}

DC.mount(Component);
</script>
</body>
</html>
