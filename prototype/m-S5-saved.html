<script>(function(){try{var q=new URLSearchParams(location.search).get('view');if(q)sessionStorage.setItem('illo-view',q);var v=sessionStorage.getItem('illo-view');var small=screen.width<=760||window.matchMedia('(max-width: 760px)').matches;var mobilePage=true;var want=v==='desktop'?false:v==='mobile'?true:small;if(want!==mobilePage)location.replace('S5-saved.html'+location.hash);}catch(e){}})();</script>
<title>일로 · 저장함</title>

<style>
body{margin:0}
a{color:#3182F6}
.illo-rank{animation:illo-hl 16s ease-in-out infinite}
@keyframes illo-hl{0%,13%{background:#F4F9FF}16%,100%{background:transparent}}
.illo-live{animation:illo-pulse 1.6s ease-in-out infinite}
@keyframes illo-pulse{0%,100%{opacity:1}50%{opacity:.25}}
.illo-scroll{scrollbar-width:none}.illo-scroll::-webkit-scrollbar{display:none}

a:hover{color:#1B64DA}
button{font-family:inherit}
.illo-rank:hover{background:#F2F4F6}
</style>
<style>html,body{background:#FAFAFA}#app>div{margin:0 auto;min-height:100vh;height:auto!important}a,button,label{cursor:pointer}:focus-visible{outline:2px solid #3182F6;outline-offset:2px}</style>

</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="width: 390px; min-height: 844px; box-sizing: border-box; background: #FAFAFA; color: #191F28; font-family: Pretendard, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column;">
  <div style="display: flex; justify-content: space-between; align-items: center; height: 56px; padding: 0 20px;"><img src="assets/illo-logo.png" alt="일로" style="height: 22px; width: auto; display: block;"><sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ true }}"><a href="m-L1-login.html" style="height: 34px; padding: 0 14px; display: flex; align-items: center; border-radius: 999px; background: #191F28; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none;">로그인</a></sc-if><sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}"><a href="m-S5-path.html" style="display: flex; align-items: center; gap: 6px; color: #191F28; font-size: 13px; font-weight: 600; text-decoration: none;"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 50%; background: #E8F3FF; color: #1B64DA; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{ userInit }}</span>{{ userName }}님</a></sc-if></div>
  <main style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 28px;">
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 8px 4px 4px;"><h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em;">마이페이지</h1><span style="font-size: 13px; color: #6B7684;">저장한 공고, 교육과정, 정책을 한곳에서 봐요</span></div>
    <nav aria-label="마이페이지 메뉴" style="display: flex; gap: 2px; padding: 4px; border-radius: 12px; background: rgba(0,23,51,0.06); "><a href="m-S5-path.html" style="flex: 1 1 0; text-align: center; padding: 9px 18px; border-radius: 9px; font-size: 14px; color: #6B7684; text-decoration: none;">한눈에 보기</a><a href="m-S5-saved.html" aria-current="page" style="flex: 1 1 0; text-align: center; padding: 9px 18px; border-radius: 9px; font-size: 14px; background: #FFFFFF; color: #191F28; font-weight: 600; box-shadow: 0 1px 3px rgba(0,23,51,0.08); text-decoration: none;">저장함 {{ savedCount }}</a><a href="m-S5-resume.html" style="flex: 1 1 0; text-align: center; padding: 9px 18px; border-radius: 9px; font-size: 14px; color: #6B7684; text-decoration: none;">이력서 등록</a></nav>
    <section aria-labelledby="m-sv" style="display: flex; flex-direction: column; gap: 14px; padding: 18px 18px 8px; background: #FFFFFF; border-radius: 20px;"><div style="display: flex; justify-content: space-between; align-items: baseline;"><h2 id="m-sv" style="margin: 0; font-size: 18px; font-weight: 700;">저장함</h2><span style="font-size: 13px; color: #8B95A1;">이 기기에 저장돼요</span></div><div class="illo-scroll" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -18px; padding: 0 18px;"><sc-for list="{{ filters }}" as="g" hint-placeholder-count="4"><button type="button" onClick="{{ g.go }}" style="{{ g.style }}">{{ g.label }}</button></sc-for></div><div><sc-if value="{{ some }}" hint-placeholder-val="{{ true }}"><sc-for list="{{ items }}" as="x" hint-placeholder-count="3"><div style="display: flex; flex-direction: column; align-items: stretch; gap: 12px; padding: 18px 0; border-top: 1px solid #F2F4F6;"><div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px;"><span style="align-self: flex-start; {{ x.kindStyle }}">{{ x.kind }}</span><span style="font-size: 16px; font-weight: 700; line-height: 1.4;">{{ x.t }}</span><span style="font-size: 13px; color: #6B7684;">{{ x.s }}</span></div><div style="display: flex; gap: 8px; align-items: center;"><sc-if value="{{ x.isPost }}" hint-placeholder-val="{{ false }}"><a href="{{ x.href }}" style="height: 38px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; background: #3182F6; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap;">내 경험과 비교</a></sc-if><sc-if value="{{ x.inApp }}" hint-placeholder-val="{{ false }}"><a href="{{ x.href }}" style="height: 38px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; background: #F2F4F6; color: #191F28; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap;">자세히 보기</a></sc-if><sc-if value="{{ x.external }}" hint-placeholder-val="{{ true }}"><a href="{{ x.href }}" target="_blank" rel="noopener" style="height: 38px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; background: #F2F4F6; color: #191F28; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap;">열기 ↗</a></sc-if><button type="button" onClick="{{ x.sv.toggle }}" aria-label="{{ x.sv.label }}" aria-pressed="{{ x.sv.saved }}" title="{{ x.sv.label }}" style="width: 38px; height: 38px; flex-shrink: 0; border: none; border-radius: 10px; background: #F2F4F6; display: flex; align-items: center; justify-content: center; cursor: pointer;"><sc-if value="{{ x.sv.saved }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#3182F6" stroke="#3182F6" stroke-width="1.8" stroke-linejoin="round"><path d="M6.5 3.5h11a1 1 0 0 1 1 1V20.5l-6.5-4-6.5 4V4.5a1 1 0 0 1 1-1z"/></svg></sc-if><sc-if value="{{ x.sv.unsaved }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B95A1" stroke-width="1.8" stroke-linejoin="round"><path d="M6.5 3.5h11a1 1 0 0 1 1 1V20.5l-6.5-4-6.5 4V4.5a1 1 0 0 1 1-1z"/></svg></sc-if></button></div></div></sc-for></sc-if><sc-if value="{{ none }}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 48px 0; border-top: 1px solid #F2F4F6; text-align: center;"><svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#D1D6DB" stroke-width="1.6" stroke-linejoin="round"><path d="M6.5 3.5h11a1 1 0 0 1 1 1V20.5l-6.5-4-6.5 4V4.5a1 1 0 0 1 1-1z"/></svg><span style="font-size: 16px; font-weight: 700;">아직 저장한 게 없어요</span><span style="font-size: 13px; color: #6B7684;">공고, 교육과정, 정책 카드의 저장 버튼을 누르면 여기에 모여요</span><div style="display: flex; gap: 8px;"><a href="m-S1-list.html" style="height: 40px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; background: #F2F4F6; color: #191F28; font-size: 14px; font-weight: 600; text-decoration: none;">공고 보기</a><a href="m-E1-edu.html" style="height: 40px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; background: #F2F4F6; color: #191F28; font-size: 14px; font-weight: 600; text-decoration: none;">교육과정 보기</a></div></div></sc-if></div></section>
  </main>
  <nav aria-label="주요 메뉴" style="position: sticky; bottom: 0; z-index: 10; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 22px 22px 0 0; box-shadow: 0 -1px 0 rgba(0,23,51,0.06), 0 -6px 20px rgba(0,23,51,0.04);">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));"><a href="m-Main.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: #191F28; font-size: 13px; font-weight: 500;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>홈</a><a href="m-S1-list.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: #191F28; font-size: 13px; font-weight: 500;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>직무 찾기</a><a href="m-E1-edu.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: #191F28; font-size: 13px; font-weight: 500;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5 12 5l9.5 4.5L12 14z"/><path d="M6.5 11.8V16c0 1.2 2.5 3 5.5 3s5.5-1.8 5.5-3v-4.2"/></svg>교육과정</a><a href="m-S5-path.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: #3182F6; font-size: 13px; font-weight: 600;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="7.8" r="4" fill="#6AA6F8"/><path d="M4.5 20.5c.8-4 3.8-6.2 7.5-6.2s6.7 2.2 7.5 6.2z" fill="#6AA6F8"/></svg>마이페이지</a></div>
    <span aria-hidden="true" style="align-self: center; width: 134px; height: 5px; margin: 18px 0 8px; border-radius: 999px; background: #191F28;"></span>
  </nav>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  illoGet(k, d) { try { const v = window.localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  illoSet(k, v) { try { if (v === null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} this.setState({ illoTick: Date.now() }); }
  illoSaved() { return this.illoGet('illo-saved', [{"id": "post-327326", "kind": "공고", "t": "성분에디터 콘텐츠 마케팅 인턴", "s": "올리브인터내셔널 · 채용연계형 인턴", "u": "https://linkareer.com/activity/327326", "h": "S3-compare.html"}, {"id": "edu-1421", "kind": "교육", "t": "(강북5기) AI 활용 SNS 마케터 양성 과정", "s": "SeSAC 강북 · 모집 중 · 11.08 마감", "u": "https://sesac.seoul.kr/sesac/course/offline/courseDetail.do?crsSn=1421", "h": "C2-course.html"}, {"id": "pol-20261018005400213993", "kind": "정책", "t": "2026 취업날개 서비스 지원", "s": "서울특별시 미래청년기획관 청년정책담당관 · 신청 중", "u": "https://www.youthcenter.go.kr/youthPolicy/ythPlcyTotalSearch/ythPlcyDetail/20261018005400213993", "h": ""}]); }
  sv(item) {
    const on = this.illoSaved().some((x) => x.id === item.id);
    return { saved: on, unsaved: !on, label: on ? '저장 해제' : '저장', toggle: () => { const s = this.illoSaved(); this.illoSet('illo-saved', on ? s.filter((x) => x.id !== item.id) : [item].concat(s)); } };
  }
  illoVals() {
    const u = this.illoGet('illo-user', null), n = this.illoSaved().length, gate = '';
    if (gate && !u) { try { window.location.replace('L1-login.html?next=' + gate); } catch (e) {} }
    return { loggedIn: !!u, loggedOut: !u, userName: u ? u.name : '', userInit: u ? u.name.slice(0, 1) : '', profileName: u ? u.name : '예시 프로필',
      savedCount: n, hasSaved: n > 0,
      loginAs: (e) => { let name = '김하늘'; try { const el = document.getElementById('su-name'); if (el && el.value.trim()) name = el.value.trim(); window.localStorage.setItem('illo-user', JSON.stringify({ name })); } catch (e) {}
        try { const nx = (window.location.search.match(/[?&]next=([\w.-]+\.html)$/) || [])[1]; if (nx) { if (e && e.preventDefault) e.preventDefault(); window.location.href = nx; } } catch (e2) {} },
      logout: () => this.illoSet('illo-user', null),
      menuOpen: !!(this.state || {}).illoMenu, toggleMenu: () => this.setState({ illoMenu: !(this.state || {}).illoMenu }), closeMenu: () => this.setState({ illoMenu: false }),
      logoutHome: () => { try { window.localStorage.removeItem('illo-user'); } catch (e) {} try { window.location.href = 'index.html'; } catch (e) {} } };
  }
  renderVals() { return Object.assign({}, this.illoVals(), this.pageVals()); }
  constructor(props) { super(props); this.state = { f: 'all' }; }
  pageVals() {
    const S = this.illoSaved(), f = this.state.f, pre = 'm-';
    const pill = (on) => on ? 'flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; cursor: pointer; white-space: nowrap; border: 1px solid #191F28; background: #191F28; color: #FFFFFF; font-weight: 600;' : 'flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; cursor: pointer; white-space: nowrap; border: 1px solid #E5E8EB; background: #FFFFFF; color: #4E5968;';
    const KC = { '공고': ['#E8F3FF', '#1B64DA'], '교육': ['#FFF4E5', '#C26A00'], '정책': ['#E6F7F1', '#0E8A63'] };
    const F = ['all', '공고', '교육', '정책'].map((k) => ({ label: (k === 'all' ? '전체' : k) + ' ' + S.filter((x) => k === 'all' || x.kind === k).length, style: pill(f === k), go: () => this.setState({ f: k }) }));
    const L = S.filter((x) => f === 'all' || x.kind === f).map((x) => ({ kind: x.kind, t: x.t, s: x.s, kindStyle: 'padding: 3px 9px; border-radius: 6px; background: ' + KC[x.kind][0] + '; color: ' + KC[x.kind][1] + '; font-size: 12px; font-weight: 700;',
      internal: !!x.h, external: !x.h, href: x.h ? pre + x.h : x.u, isPost: x.kind === '공고' && !!x.h, inApp: x.kind !== '공고' && !!x.h, sv: this.sv(x) }));
    return { filters: F, items: L, none: L.length === 0, some: L.length > 0, total: S.length };
  }
}

DC.mount(Component);
</script>
</body>
</html>
