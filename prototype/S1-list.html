<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<script>(function(){try{var q=new URLSearchParams(location.search).get('view');if(q)sessionStorage.setItem('illo-view',q);var v=sessionStorage.getItem('illo-view');var small=screen.width<=760||window.matchMedia('(max-width: 760px)').matches;var mobilePage=false;var want=v==='desktop'?false:v==='mobile'?true:small;if(want!==mobilePage)location.replace('m-S1-list.html'+location.hash);}catch(e){}})();</script>
<title>일로 · 직무 찾기</title>
<link rel="icon" href="assets/illo-logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
body{margin:0}
a{color:#3182F6}
.illo-rank{animation:illo-hl 16s ease-in-out infinite}
@keyframes illo-hl{0%,13%{background:#F4F9FF}16%,100%{background:transparent}}
.illo-live{animation:illo-pulse 1.6s ease-in-out infinite}
@keyframes illo-pulse{0%,100%{opacity:1}50%{opacity:.25}}
.illo-scroll{scrollbar-width:none}.illo-scroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){.illo-rank,.illo-live{animation:none}}
a:hover{color:#1B64DA}
button{font-family:inherit}
.illo-rank:hover{background:#F2F4F6}
</style>
<style>html,body{background:#FAFAFA}#app>div{margin:0 auto;min-height:100vh;height:auto!important}a,button,label{cursor:pointer}:focus-visible{outline:2px solid #3182F6;outline-offset:2px}</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="width: 1280px; height: 1800px; box-sizing: border-box; background: #FAFAFA; color: #191F28; font-family: Pretendard, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column;">
  <header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 88px; padding: 0 40px;">
    <a href="index.html" style="justify-self: start; display: block;"><img src="assets/illo-logo.png" alt="일로 홈" style="height: 26px; width: auto; display: block;"></a>
    <nav aria-label="주요 메뉴"><ol style="display: flex; gap: 2px; padding: 4px; margin: 0; list-style: none; border-radius: 999px; background: rgba(0,23,51,0.06);"><li><a href="index.html" style="display: block; padding: 9px 18px; border-radius: 999px; font-size: 14px; line-height: 1.4; color: #4E5968; text-decoration: none; white-space: nowrap;">홈</a></li><li><a href="S1-list.html" aria-current="page" style="display: block; padding: 9px 18px; border-radius: 999px; font-size: 14px; line-height: 1.4; color: #191F28; font-weight: 600; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,23,51,0.08); text-decoration: none; white-space: nowrap;">직무 찾기</a></li><li><a href="E1-edu.html" style="display: block; padding: 9px 18px; border-radius: 999px; font-size: 14px; line-height: 1.4; color: #4E5968; text-decoration: none; white-space: nowrap;">교육과정</a></li><li><a href="S5-path.html" style="display: block; padding: 9px 18px; border-radius: 999px; font-size: 14px; line-height: 1.4; color: #4E5968; text-decoration: none; white-space: nowrap;">마이페이지</a></li></ol></nav>
    <div style="justify-self: end; display: flex; align-items: center; gap: 8px;"><sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ true }}"><a href="L1-login.html" style="height: 40px; padding: 0 14px; display: flex; align-items: center; color: #191F28; font-size: 14px; font-weight: 600; text-decoration: none;">로그인</a><a href="L2-signup.html" style="height: 40px; padding: 0 18px; display: flex; align-items: center; border-radius: 999px; background: #191F28; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none;">회원가입</a></sc-if><sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}"><a href="S5-saved.html" aria-label="저장함 {{ savedCount }}개" style="position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #191F28;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6.5 3.5h11a1 1 0 0 1 1 1V20.5l-6.5-4-6.5 4V4.5a1 1 0 0 1 1-1z"/></svg><sc-if value="{{ hasSaved }}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #3182F6; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{ savedCount }}</span></sc-if></a><a href="S5-path.html" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 4px; border-radius: 999px; background: #FFFFFF; color: #191F28; font-size: 14px; font-weight: 600; text-decoration: none;"><img src="assets/avatar-haneul.jpg" alt="" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; object-fit: cover; display: block;">{{ userName }}님</a></sc-if></div>
  </header>
  <div style="padding: 28px 56px 0; display: flex; justify-content: space-between; align-items: center;">
    <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em;">{{ jobName }}</h1>
    <div role="tablist" aria-label="경력 구분" style="display: flex; gap: 2px; padding: 4px; border-radius: 12px; background: rgba(0,23,51,0.06);"><button type="button" role="tab" onClick="{{ pickNew }}" style="{{ newStyle }}">신입, 인턴</button><button type="button" role="tab" onClick="{{ pickExp }}" style="{{ expStyle }}">경력</button></div>
  </div>
  <div style="margin: 24px 56px 0; display: flex; flex-direction: column; gap: 14px;"><div style="display: flex; align-items: center; gap: 36px; padding-left: 8px; border-top: 1px solid #E5E8EB; border-bottom: 1px solid #E5E8EB;"><sc-for list="{{ ftabs }}" as="f" hint-placeholder-count="3"><button type="button" onClick="{{ f.go }}" aria-expanded="{{ f.cur }}" style="{{ f.style }}">{{ f.label }}</button></sc-for><div style="margin-left: auto; padding: 8px 0;"><label style="width: 300px; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; border: 1px solid #E5E8EB; border-radius: 12px; background: #FFFFFF; box-sizing: border-box;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">공고명, 기업 검색</span><input type="search" value="{{ q }}" onChange="{{ setQ }}" placeholder="공고명, 기업 검색" style="flex: 1 1 0; min-width: 0; border: none; background: transparent; font-size: 15px; font-family: inherit; color: #191F28; outline: none;"></label></div></div><sc-if value="{{ fPanel }}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 20px; border-radius: 14px; background: #FFFFFF;"><span style="font-size: 13px; color: #6B7684;">{{ fPanelTitle }}</span><div style="display: flex; gap: 8px; flex-wrap: wrap;"><sc-for list="{{ fopts }}" as="o" hint-placeholder-count="3"><button type="button" onClick="{{ o.go }}" aria-pressed="{{ o.on }}" style="{{ o.style }}">{{ o.label }}</button></sc-for></div></div></sc-if><sc-if value="{{ hasF }}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;"><sc-for list="{{ fsel }}" as="x" hint-placeholder-count="1"><button type="button" onClick="{{ x.go }}" aria-label="{{ x.label }} 빼기" style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: none; border-radius: 999px; background: #E8F3FF; color: #191F28; font-size: 13px; font-family: inherit; cursor: pointer;">{{ x.label }}<span aria-hidden="true" style="font-size: 15px; color: #4E5968;">×</span></button></sc-for><button type="button" onClick="{{ resetF }}" style="border: none; background: none; padding: 0 6px; font-size: 13px; font-weight: 600; color: #4E5968; cursor: pointer; font-family: inherit;">↺ 초기화</button></div></sc-if></div>
  <div style="display: flex; flex-direction: column; gap: 16px; padding: 24px 56px 56px;">
    <sc-if value="{{ showFit }}" hint-placeholder-val="{{ true }}">
<section aria-label="이 직무가 원하는 역량" style="display: flex; align-items: center; gap: 24px; padding: 20px 28px; background: #FFFFFF; border-radius: 20px;"><h2 style="flex-shrink: 0; margin: 0; font-size: 15px; font-weight: 700;">많이 찾는 역량</h2><div style="display: flex; gap: 8px 16px; flex-wrap: wrap;"><span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #4E5968;"><span style="font-weight: 700; color: #1B64DA;">1</span>트렌드 감각, 밈</span><span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #4E5968;"><span style="font-weight: 700; color: #1B64DA;">2</span>콘텐츠 기획</span><span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #4E5968;"><span style="font-weight: 700; color: #1B64DA;">3</span>데이터, 성과 분석</span><span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #4E5968;"><span style="font-weight: 700; color: #1B64DA;">4</span>디자인 툴</span><span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #4E5968;"><span style="font-weight: 700; color: #1B64DA;">5</span>영상, 숏폼 제작</span><span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #4E5968;"><span style="font-weight: 700; color: #1B64DA;">6</span>영상 툴 (프리미어 등)</span><span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #4E5968;"><span style="font-weight: 700; color: #1B64DA;">7</span>포트폴리오</span><span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #4E5968;"><span style="font-weight: 700; color: #1B64DA;">8</span>카피라이팅</span></div><div style="flex-shrink: 0; margin-left: auto; display: flex; align-items: center; gap: 16px;"><sc-if value="{{ unregistered }}" hint-placeholder-val="{{ true }}"><span style="padding: 3px 8px; border-radius: 6px; background: #F2F4F6; color: #4E5968; font-size: 12px;">이력서를 등록해주세요</span></sc-if><button type="button" onClick="{{ openTrend }}" style="flex-shrink: 0; border: none; background: none; padding: 0; font-size: 14px; font-weight: 600; color: #1B64DA; cursor: pointer; font-family: inherit; white-space: nowrap;">이 직무 트렌드 보기 ›</button></div></section>    </sc-if>
    <sc-if value="{{ fitTodo }}" hint-placeholder-val="{{ false }}"><section style="display: flex; align-items: center; gap: 12px; padding: 20px 28px; background: #FFFFFF; border-radius: 20px;"><span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; background: #F0EBFF; color: #6B4EE6; font-size: 11px; font-weight: 700; letter-spacing: 0.02em;"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="#6B4EE6"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg>AI</span><span style="font-size: 15px; line-height: 1.5; color: #4E5968;">이 직무의 역량 분석은 준비 중이에요. 공고 원문은 지금 볼 수 있고, 공고 비교는 <b style="color: #191F28;">SNS 콘텐츠 마케팅</b>으로 시연해요</span></section></sc-if>
    <sc-if value="{{ isExp }}" hint-placeholder-val="{{ false }}"><section aria-label="경력 공고 안내" style="display: flex; align-items: center; gap: 24px; padding: 20px 28px; background: #FFFFFF; border-radius: 20px;"><h2 style="flex-shrink: 0; margin: 0; font-size: 15px; font-weight: 700;">경력 공고</h2><span style="font-size: 14px; color: #4E5968;">공고를 골라 바로 비교해요. 시연은 맨 위 공고로 진행해요</span><sc-if value="{{ isSns }}" hint-placeholder-val="{{ true }}"><div style="margin-left: auto;"><button type="button" onClick="{{ openTrend }}" style="flex-shrink: 0; border: none; background: none; padding: 0; font-size: 14px; font-weight: 600; color: #1B64DA; cursor: pointer; font-family: inherit; white-space: nowrap;">이 직무 트렌드 보기 ›</button></div></sc-if></section></sc-if>
    <section aria-labelledby="list" style="display: flex; flex-direction: column; gap: 14px; padding: 24px 28px 12px; background: #FFFFFF; border-radius: 20px;">
      <h2 id="list" style="margin: 0; font-size: 18px; font-weight: 700;">공고를 골라 비교해 보세요</h2>
      <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 4px;"><span style="font-size: 14px; color: #6B7684;"><b style="color: #191F28; font-weight: 700;">{{ total }}</b>건 중 {{ range }}</span><div style="display: flex; gap: 10px; align-items: center;"><button type="button" onClick="{{ sort.rec.go }}" style="{{ sort.rec.style }}">추천순</button><span aria-hidden="true" style="color: #D1D6DB;">·</span><button type="button" onClick="{{ sort.new.go }}" style="{{ sort.new.style }}">최신순</button><span aria-hidden="true" style="color: #D1D6DB;">·</span><button type="button" onClick="{{ sort.close.go }}" style="{{ sort.close.style }}">마감 임박순</button></div></div><sc-if value="{{ hasSortNote }}" hint-placeholder-val="{{ true }}"><p role="status" style="margin: 0; font-size: 13px; line-height: 1.5; color: #6B7684;">{{ sortNote }}</p></sc-if>
      <div><div style="display: grid; grid-template-columns: 200px minmax(0, 1fr) 72px 88px 92px 150px; gap: 16px; padding: 10px 0; font-size: 13px; color: #6B7684;"><span>기업명</span><span>공고명</span><span style="text-align: center;">채용형태</span><span style="text-align: center;">기업 형태</span><span style="text-align: center;">마감일</span><span></span></div><sc-for list="{{ rows }}" as="r" hint-placeholder-count="10"><div style="display: grid; grid-template-columns: 200px minmax(0, 1fr) 72px 88px 92px 150px; align-items: center; gap: 16px; padding: 16px 0; border-top: 1px solid #F2F4F6;"><span style="display: flex; align-items: center; gap: 12px; min-width: 0;"><span aria-hidden="true" style="{{ r.logo }}">{{ r.init }}</span><span style="font-size: 14px; color: #4E5968; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ r.c }}</span></span><span style="min-width: 0; display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ r.t }}</span><span style="display: flex; gap: 4px; flex-wrap: wrap;"><sc-if value="{{ r.demo }}" hint-placeholder-val="{{ false }}"><span style="padding: 3px 8px; border-radius: 6px; background: #F0EBFF; font-size: 12px; color: #6B4EE6; font-weight: 600;">시연 공고</span></sc-if><span style="{{ r.ovStyle }}">{{ r.ov }}</span></span></span><span style="font-size: 14px; color: #191F28; text-align: center;">{{ r.ty }}</span><span style="font-size: 14px; color: #4E5968; text-align: center;">{{ r.size }}</span><span style="display: flex; flex-direction: column; align-items: center; gap: 2px;"><span style="{{ r.closeStyle }}">{{ r.closeTxt }}</span><sc-if value="{{ r.hasDue }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 700; color: #F04452;">{{ r.due }}</span></sc-if></span><span style="display: flex; justify-content: flex-end; gap: 8px;"><button type="button" onClick="{{ r.sv.toggle }}" aria-label="{{ r.sv.label }}" aria-pressed="{{ r.sv.saved }}" title="{{ r.sv.label }}" style="width: 38px; height: 38px; flex-shrink: 0; border: none; border-radius: 10px; background: #F2F4F6; display: flex; align-items: center; justify-content: center; cursor: pointer;"><sc-if value="{{ r.sv.saved }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#3182F6" stroke="#3182F6" stroke-width="1.8" stroke-linejoin="round"><path d="M6.5 3.5h11a1 1 0 0 1 1 1V20.5l-6.5-4-6.5 4V4.5a1 1 0 0 1 1-1z"/></svg></sc-if><sc-if value="{{ r.sv.unsaved }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B95A1" stroke-width="1.8" stroke-linejoin="round"><path d="M6.5 3.5h11a1 1 0 0 1 1 1V20.5l-6.5-4-6.5 4V4.5a1 1 0 0 1 1-1z"/></svg></sc-if></button><sc-if value="{{ r.demo }}" hint-placeholder-val="{{ false }}"><a href="S3-compare.html" style="height: 38px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; background: #3182F6; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap;">비교하기</a></sc-if><sc-if value="{{ r.notDemo }}" hint-placeholder-val="{{ true }}"><a href="{{ r.url }}" target="_blank" rel="noopener" style="height: 38px; padding: 0 12px; display: flex; align-items: center; border-radius: 10px; background: #F2F4F6; color: #191F28; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap;">원문 ↗</a></sc-if></span></div></sc-for><sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 48px 0; border-top: 1px solid #F2F4F6; color: #6B7684; font-size: 15px;">검색 결과가 없어요<button type="button" onClick="{{ clearQ }}" style="height: 38px; padding: 0 14px; border: none; border-radius: 10px; background: #F2F4F6; color: #191F28; font-size: 14px; font-weight: 600; cursor: pointer;">검색어 지우기</button></div></sc-if><sc-if value="{{ hasRows }}" hint-placeholder-val="{{ true }}"><nav aria-label="페이지" style="display: flex; justify-content: center; align-items: center; gap: 4px; padding: 20px 0 8px; border-top: 1px solid #F2F4F6;"><button type="button" onClick="{{ prev }}" aria-label="이전 페이지" style="{{ prevStyle }}">‹</button><sc-for list="{{ nums }}" as="p" hint-placeholder-count="5"><button type="button" onClick="{{ p.go }}" aria-current="{{ p.cur }}" style="{{ p.style }}">{{ p.n }}</button></sc-for><button type="button" onClick="{{ next }}" aria-label="다음 페이지" style="{{ nextStyle }}">›</button></nav></sc-if></div>
      <span style="font-size: 12px; color: #8B95A1;">출처: {{ srcNote }}</span>
    </section>
  </div>
  <sc-if value="{{ trendOpen }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-modal="true" aria-label="실시간 공고 키워드 전체 순위" style="position: fixed; inset: 0; z-index: 50; display: flex; justify-content: center; align-items: center; background: rgba(0,23,51,0.38);">
    <div style="width: 560px; max-height: 88vh; border-radius: 24px; padding: 28px; box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><div style="display: flex; align-items: center; gap: 8px;"><h2 style="margin: 0; font-size: 20px; font-weight: 700;">실시간 공고 키워드</h2><span style="display: flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 999px; background: #FFEEEE; color: #F04452; font-size: 10px; font-weight: 700;"><span class="illo-live" style="width: 6px; height: 6px; border-radius: 50%; background: #F04452;"></span>LIVE</span></div>
        <button type="button" onClick="{{ closeTrend }}" aria-label="닫기" style="width: 36px; height: 36px; border: none; border-radius: 50%; background: #F2F4F6; color: #191F28; font-size: 18px; cursor: pointer;">✕</button></div>
