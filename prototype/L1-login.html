<style>
body{margin:0}

.illo-rank{animation:illo-hl 16s ease-in-out infinite}
@keyframes illo-hl{0%,13%{background:#F4F9FF}16%,100%{background:transparent}}
.illo-live{animation:illo-pulse 1.6s ease-in-out infinite}
@keyframes illo-pulse{0%,100%{opacity:1}50%{opacity:.25}}
.illo-scroll{scrollbar-width:none}.illo-scroll::-webkit-scrollbar{display:none}

<template id="dc">

<div style="width: 1280px; height: 900px; box-sizing: border-box; background: #FAFAFA; color: #191F28; font-family: Pretendard, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column;">
  <header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 88px; padding: 0 40px;">
    <a href="index.html" style="justify-self: start; display: block;"><img src="assets/illo-logo.png" alt="일로 홈" style="height: 26px; width: auto; display: block;"></a>
    <nav aria-label="주요 메뉴"><ol style="display: flex; gap: 2px; padding: 4px; margin: 0; list-style: none; border-radius: 999px; background: rgba(0,23,51,0.06);"><li><a href="index.html" style="display: block; padding: 9px 18px; border-radius: 999px; font-size: 14px; line-height: 1.4; color: #4E5968; text-decoration: none; white-space: nowrap;">홈</a></li><li><a href="S1-list.html" style="display: block; padding: 9px 18px; border-radius: 999px; font-size: 14px; line-height: 1.4; color: #4E5968; text-decoration: none; white-space: nowrap;">직무 찾기</a></li><li><a href="E1-edu.html" style="display: block; padding: 9px 18px; border-radius: 999px; font-size: 14px; line-height: 1.4; color: #4E5968; text-decoration: none; white-space: nowrap;">교육과정</a></li><li><a href="S5-path.html" style="display: block; padding: 9px 18px; border-radius: 999px; font-size: 14px; line-height: 1.4; color: #4E5968; text-decoration: none; white-space: nowrap;">마이페이지</a></li></ol></nav>
    <div style="justify-self: end; display: flex; align-items: center; gap: 8px;"><sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ true }}"><a href="L1-login.html" style="height: 40px; padding: 0 14px; display: flex; align-items: center; color: #191F28; font-size: 14px; font-weight: 600; text-decoration: none;">로그인</a><a href="L2-signup.html" style="height: 40px; padding: 0 18px; display: flex; align-items: center; border-radius: 999px; background: #191F28; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none;">회원가입</a></sc-if><sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}"><a href="S5-saved.html" aria-label="저장함 {{ savedCount }}개" style="position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #191F28;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6.5 3.5h11a1 1 0 0 1 1 1V20.5l-6.5-4-6.5 4V4.5a1 1 0 0 1 1-1z"/></svg><sc-if value="{{ hasSaved }}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #3182F6; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{ savedCount }}</span></sc-if></a><a href="S5-path.html" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 4px; border-radius: 999px; background: #FFFFFF; color: #191F28; font-size: 14px; font-weight: 600; text-decoration: none;"><img src="assets/avatar-haneul.jpg" alt="" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; object-fit: cover; display: block;">{{ userName }}님</a></sc-if></div>
  </header>
  <div style="display: flex; justify-content: center; padding: 32px 56px 72px;"><section style="display: flex; flex-direction: column; gap: 18px; padding: 36px 40px; background: #FFFFFF; border-radius: 20px; width: 440px; box-sizing: border-box;"><div style="display: flex; flex-direction: column; gap: 6px;"><h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em;">로그인</h1><span style="font-size: 14px; line-height: 1.5; color: #6B7684;">저장한 공고와 이력서를 어디서든 이어서 봐요</span></div><div style="display: flex; flex-direction: column; gap: 8px;"><a href="index.html" onClick="{{ loginAs }}" style="height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; background: #FEE500; color: #191919; font-size: 15px; font-weight: 600; text-decoration: none;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M12 4C7 4 3 7.1 3 11c0 2.5 1.7 4.7 4.2 5.9l-.9 3.4c-.1.3.3.6.6.4l4-2.6h1.1c5 0 9-3.1 9-7.1S17 4 12 4z" fill="#191919"/></svg>카카오로 시작하기</a><a href="index.html" onClick="{{ loginAs }}" style="height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; background: #03C75A; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M14.6 12.5 9.2 5H5v14h4.4v-7.5L14.8 19H19V5h-4.4z" fill="#FFFFFF"/></svg>네이버로 시작하기</a><a href="index.html" onClick="{{ loginAs }}" style="height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; background: #FFFFFF; color: #191F28; font-size: 15px; font-weight: 600; text-decoration: none; box-shadow: inset 0 0 0 1px #E5E8EB;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z" fill="#4285F4"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" fill="#34A853"/><path d="M6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9z" fill="#FBBC05"/><path d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.5L6.4 10C7.2 7.8 9.4 6 12 6z" fill="#EA4335"/></svg>Google로 시작하기</a></div><div style="display: flex; align-items: center; gap: 12px; color: #8B95A1; font-size: 13px;"><span style="flex: 1 1 0; height: 1px; background: #E5E8EB;"></span>또는 이메일로<span style="flex: 1 1 0; height: 1px; background: #E5E8EB;"></span></div><label for="li-email" style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; color: #6B7684;">이메일</span><input id="li-email" type="email" placeholder="name@example.com" style="height: 48px; box-sizing: border-box; padding: 0 14px; font-size: 16px; border: none; border-radius: 12px; font-family: inherit; background: #F2F4F6; color: #191F28; width: 100%; font-size: 15px;"></label><label for="li-pw" style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; color: #6B7684;">비밀번호</span><input id="li-pw" type="password" placeholder="비밀번호" style="height: 48px; box-sizing: border-box; padding: 0 14px; font-size: 16px; border: none; border-radius: 12px; font-family: inherit; background: #F2F4F6; color: #191F28; width: 100%; font-size: 15px;"></label><a href="index.html" onClick="{{ loginAs }}" style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #3182F6; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none;">로그인</a><div style="display: flex; justify-content: space-between; font-size: 13px;"><a href="L1-login.html" style="color: #6B7684; text-decoration: none;">비밀번호 찾기</a><span style="color: #6B7684;">처음이세요? <a href="L2-signup.html" style="font-weight: 600; text-decoration: none;">회원가입</a></span></div><span style="padding: 10px 12px; border-radius: 10px; background: #F2F4F6; font-size: 12px; line-height: 1.5; color: #6B7684;">시연용 화면이에요. 아무 값이나 넣고 눌러도 예시 계정(김하늘)으로 로그인돼요</span></section></div>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  illoGet(k, d) { try { const v = window.localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  illoSet(k, v) { try { if (v === null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} this.setState({ illoTick: Date.now() }); }
  illoSaved() { return this.illoGet('illo-saved', [{"id": "post-327326", "kind": "공고", "t": "성분에디터 콘텐츠 마케팅 인턴", "s": "올리브인터내셔널 · 채용연계형 인턴", "u": "https://linkareer.com/activity/327326", "h": "S3-compare.html"}, {"id": "edu-1421", "kind": "교육", "t": "(강북5기) AI 활용 SNS 마케터 양성 과정", "s": "SeSAC 강북 · 모집 중 · 11.08 마감", "u": "https://sesac.seoul.kr/sesac/course/offline/courseDetail.do?crsSn=1421", "h": "C2-course.html"}, {"id": "pol-20261018005400213993", "kind": "정책", "t": "2026 취업날개 서비스 지원", "s": "서울특별시 미래청년기획관 청년정책담당관 · 신청 중", "u": "https://www.youthcenter.go.kr/youthPolicy/ythPlcyTotalSearch/ythPlcyDetail/20261018005400213993", "h": ""}]); }
  sv(item) {
    const on = this.illoSaved().some((x) => x.id === item.id);
    return { saved: on, unsaved: !on, label: on ? '저장 해제' : '저장', toggle: () => { const s = this.illoSaved(); this.illoSet('illo-saved', on ? s.filter((x) => x.id !== item.id) : [item].concat(s)); } };
  }
  illoVals() {
    const u = this.illoGet('illo-user', null), n = this.illoSaved().length;
    return { loggedIn: !!u, loggedOut: !u, userName: u ? u.name : '', userInit: u ? u.name.slice(0, 1) : '', profileName: u ? u.name : '예시 프로필',
      savedCount: n, hasSaved: n > 0,
      loginAs: () => { let name = '김하늘'; try { const el = document.getElementById('su-name'); if (el && el.value.trim()) name = el.value.trim(); window.localStorage.setItem('illo-user', JSON.stringify({ name })); } catch (e) {} },
      logout: () => this.illoSet('illo-user', null) };
  }
  renderVals() { return Object.assign({}, this.illoVals(), this.pageVals()); }
  pageVals() { return {}; }
}

DC.mount(Component);
</script>
</body>
</html>
