      menuOpen: !!(this.state || {}).illoMenu, toggleMenu: () => this.setState({ illoMenu: !(this.state || {}).illoMenu }), closeMenu: () => this.setState({ illoMenu: false }),
      logoutHome: () => { try { window.localStorage.removeItem('illo-user'); } catch (e) {} try { window.location.href = 'index.html'; } catch (e) {} } };
  }
  renderVals() { return Object.assign({}, this.illoVals(), this.pageVals()); }
  constructor(props) { super(props); this.state = { saved: false }; }
  pageVals() { return { saved: this.state.saved, notSaved: !this.state.saved, save: () => this.setState({ saved: true }) }; }
}
