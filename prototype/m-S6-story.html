<body>
<div id="app"></div>
<template id="dc">

<div style="width: 390px; min-height: 844px; box-sizing: border-box; background: #FAFAFA; color: #191F28; font-family: Pretendard, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column;">
  <div style="display: flex; justify-content: space-between; align-items: center; height: 56px; padding: 0 20px;"><img src="assets/illo-logo.png" alt="일로" style="height: 22px; width: auto; display: block;"></div>
  <main style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 28px;">
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 8px 4px 4px;"><a href="m-S5-path.html" style="font-size: 13px; color: #6B7684; text-decoration: none;">‹ 마이페이지</a><h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em;">취업 수기 남기기</h1><span style="font-size: 13px; color: #6B7684;">내 경험이 다음 청년의 기회가 돼요. 이름과 회사명은 공개되지 않아요</span></div>
    <div style="display: flex; flex-direction: column; gap: 6px;"><label for="m-job" style="font-size: 13px; color: #6B7684;">합격한 직무</label><select id="m-job" style="height: 48px; padding: 0 12px; font-size: 15px; border: none; border-radius: 12px; font-family: inherit; background: #FFFFFF; color: #191F28; width: 100%;"><option>SNS 콘텐츠 마케터</option></select></div>
    <div style="display: flex; flex-direction: column; gap: 6px;"><label for="m-course" style="font-size: 13px; color: #6B7684;">도움이 된 과정</label><select id="m-course" style="height: 48px; padding: 0 12px; font-size: 15px; border: none; border-radius: 12px; font-family: inherit; background: #FFFFFF; color: #191F28; width: 100%;"><option>(강북5기) AI 활용 SNS 마케터 양성 과정</option></select></div>
    <div style="display: flex; flex-direction: column; gap: 8px;"><span style="font-size: 13px; color: #6B7684;">도움이 된 경험 (여러 개 선택)</span><div style="display: flex; gap: 6px; flex-wrap: wrap;"><span style="padding: 8px 13px; border-radius: 999px; background: #E8F3FF; color: #1B64DA; font-size: 13px;">학생회 인스타 운영</span><span style="padding: 8px 13px; border-radius: 999px; background: #E8F3FF; color: #1B64DA; font-size: 13px;">숏폼 과정 포트폴리오</span><span style="padding: 8px 13px; border-radius: 999px; background: #FFFFFF; color: #191F28; font-size: 13px;">자격증</span><span style="padding: 8px 13px; border-radius: 999px; background: #FFFFFF; color: #191F28; font-size: 13px;">어학</span><span style="padding: 8px 13px; border-radius: 999px; background: #FFFFFF; color: #191F28; font-size: 13px;">공모전</span></div></div>
    <div style="display: flex; flex-direction: column; gap: 6px;"><label for="m-tip" style="font-size: 13px; color: #6B7684;">다음 청년에게 한마디 (선택)</label><textarea id="m-tip" style="height: 100px; box-sizing: border-box; padding: 12px 14px; font-size: 15px; line-height: 1.6; border: none; border-radius: 12px; font-family: inherit; resize: none; background: #FFFFFF; width: 100%;">면접에서 팔로워 증가 수치랑 릴스 포트폴리오를 많이 물어봤어요</textarea></div>
    <button type="button" onClick="{{ submit }}" style="height: 52px; border: none; border-radius: 14px; background: #3182F6; color: #FFFFFF; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer;">수기 남기기</button>
    <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}"><span role="status" style="padding: 12px 14px; border-radius: 12px; background: #E8F3FF; color: #1B64DA; font-size: 13px; line-height: 1.5;">고마워요! 수기가 등록됐어요 · 시연용이라 실제로 저장되지는 않아요</span></sc-if>
    <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}"><span style="font-size: 12px; color: #8B95A1; text-align: center;">남긴 수기는 개인정보를 뺀 통계로만 쓰여요</span></sc-if>
    <section style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px; padding: 18px; background: #F2F4F6; border-radius: 16px;">
      <span style="font-size: 12px; color: #6B7684;">다음 청년의 화면에 이렇게 보여요</span>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; background: #FFFFFF; border-radius: 12px;"><span style="font-size: 14px; font-weight: 600;">(강북5기) AI 활용 SNS 마케터 양성 과정</span><span style="font-size: 13px; color: #333D4B;">이 과정을 듣고 SNS 콘텐츠 마케터로 취업한 수기 [N]건</span><span style="font-size: 12px; color: #6B7684;">"면접에서 릴스 포트폴리오를 많이 물어봤어요"</span></div>
      <span style="align-self: flex-start; padding: 4px 8px; border: 1.5px dashed #D1D6DB; border-radius: 6px; font-size: 11px; color: #6B7684;">예시 데이터 · 실제 수기가 쌓이면 표시</span>
    </section>
  </main>
  <nav aria-label="주요 메뉴" style="position: sticky; bottom: 0; z-index: 10; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 22px 22px 0 0; box-shadow: 0 -1px 0 rgba(0,23,51,0.06), 0 -6px 20px rgba(0,23,51,0.04);">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));"><a href="m-Main.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: #191F28; font-size: 13px; font-weight: 500;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>홈</a><a href="m-S1-list.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: #191F28; font-size: 13px; font-weight: 500;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>직무 찾기</a><a href="m-E1-edu.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: #191F28; font-size: 13px; font-weight: 500;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5 12 5l9.5 4.5L12 14z"/><path d="M6.5 11.8V16c0 1.2 2.5 3 5.5 3s5.5-1.8 5.5-3v-4.2"/></svg>교육과정</a><a href="m-S5-path.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: #3182F6; font-size: 13px; font-weight: 600;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="7.8" r="4" fill="#6AA6F8"/><path d="M4.5 20.5c.8-4 3.8-6.2 7.5-6.2s6.7 2.2 7.5 6.2z" fill="#6AA6F8"/></svg>마이페이지</a></div>
    <span aria-hidden="true" style="align-self: center; width: 134px; height: 5px; margin: 18px 0 8px; border-radius: 999px; background: #191F28;"></span>
  </nav>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  illoGet(k, d) { try { const v = window.localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  illoSet(k, v) { try { if (v === null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} this.setState({ illoTick: Date.now() }); }
  illoSaved() { return this.illoGet('illo-saved', [{"id": "post-327326", "kind": "공고", "t": "성분에디터 콘텐츠 마케팅 인턴", "s": "올리브인터내셔널 · 채용연계형 인턴", "u": "https://linkareer.com/activity/327326", "h": "S3-compare.html"}, {"id": "edu-1421", "kind": "교육", "t": "(강북5기) AI 활용 SNS 마케터 양성 과정", "s": "SeSAC 강북 · 모집 중 · 11.08 마감", "u": "https://sesac.seoul.kr/sesac/course/offline/courseDetail.do?crsSn=1421", "h": "C2-course.html"}, {"id": "pol-20261018005400213993", "kind": "정책", "t": "2026 취업날개 서비스 지원", "s": "서울특별시 미래청년기획관 청년정책담당관 · 신청 중", "u": "https://www.youthcenter.go.kr/youthPolicy/ythPlcyTotalSearch/ythPlcyDetail/20261018005400213993", "h": ""}]); }
  sv(item) {
    const on = this.illoSaved().some((x) => x.id === item.id);
    return { saved: on, unsaved: !on, label: on ? '저장 해제' : '저장', toggle: () => { const s = this.illoSaved(); this.illoSet('illo-saved', on ? s.filter((x) => x.id !== item.id) : [item].concat(s)); } };
  }
  illoVals() {
    const u = this.illoGet('illo-user', null), n = this.illoSaved().length, gate = '';
    if (gate && !u) { try { window.location.replace('L1-login.html?next=' + gate); } catch (e) {} }
    return { loggedIn: !!u, loggedOut: !u, userName: u ? u.name : '', userInit: u ? u.name.slice(0, 1) : '', profileName: u ? u.name : '예시 프로필',
      savedCount: n, hasSaved: n > 0,
      loginAs: (e) => { let name = '김하늘'; try { const el = document.getElementById('su-name'); if (el && el.value.trim()) name = el.value.trim(); window.localStorage.setItem('illo-user', JSON.stringify({ name })); } catch (e) {}
        try { const nx = (window.location.search.match(/[?&]next=([\w.-]+\.html)$/) || [])[1]; if (nx) { if (e && e.preventDefault) e.preventDefault(); window.location.href = nx; } } catch (e2) {} },
      logout: () => this.illoSet('illo-user', null) };
  }
  renderVals() { return Object.assign({}, this.illoVals(), this.pageVals()); }
  constructor(props) { super(props); this.state = { sent: false }; }
  pageVals() { const sent = this.state.sent; return { sent, notSent: !sent, submit: () => this.setState({ sent: true }) }; }
}

DC.mount(Component);
</script>
</body>
</html>
