<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일로 · 공고에서 시작하는 청년 커리어 에이전트</title>
<meta name="description" content="해 본 일을 말하면 실제 공고와 문장 단위로 비교하고, 빈칸은 SeSAC 과정과 서울 청년 정책으로 이어 드려요.">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="일로">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F6F5">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="app.css?v=20261105d">
</head>
<body>
<div id="app" class="shell">
  <header class="mtop" aria-label="모바일 상단">
    <button type="button" class="icon-btn" data-act="menu" aria-label="메뉴 열기" aria-expanded="false"><svg class="i-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg><svg class="i-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <a class="mtop-brand" href="#/" aria-label="일로 홈"><img src="assets/illo_logo.png" alt="일로"></a>
    <a class="mtop-me" href="#/me" data-act="me-menu" aria-label="내 계정 메뉴"><img src="assets/avatar-haneul.jpg" alt=""></a>
  </header>
  <div class="scrim" data-act="menu-close" aria-hidden="true"></div>
  <aside class="side" aria-label="사이드바">
    <a class="brand" href="#/" aria-label="일로 홈"><img src="assets/illo_logo.png" alt="일로"></a>
    <button type="button" class="btn btn-line new-chat" data-act="new-chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>새 대화</button>
    <nav aria-label="주요 메뉴"><ul class="nav">
      <li><a href="#/" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-6h-5v6H4z"/></svg>홈</a></li>
      <li><a href="#/jobs" data-nav="jobs"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>직무 찾기</a></li>
      <li><a href="#/edu" data-nav="edu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9.5 12 5l9.5 4.5L12 14z"/><path d="M6.5 11.8V16c0 1.2 2.5 3 5.5 3s5.5-1.8 5.5-3v-4.2"/></svg>교육과정과 정책</a></li>
      <li><a href="#/trend" data-nav="trend"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/></svg>트렌드 스펙<span class="live-dot"></span></a></li>
      <li><a href="#/apply" data-nav="apply"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>지원서<span class="count" id="app-count"></span></a></li>
      <li><a href="#/tasks" data-nav="saved"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1V20.5l-6.5-4-6.5 4V4.5a1 1 0 0 1 1-1z"/></svg>할 일과 저장<span class="count" id="saved-count"></span></a></li>
    </ul></nav>
    <a class="goal" href="#/me" data-goal></a>
    <div class="side-sec"><span class="eyebrow">할 일</span><ul class="todo" id="todo"></ul></div>
    <div class="recent">
      <span class="eyebrow">최근 대화</span>
      <ul id="recent" class="recent-list"></ul>
    </div>
    <div id="me-slot"></div>
  </aside>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div id="drawer-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script src="app.js?v=20261105d"></script>
</body>
</html>
